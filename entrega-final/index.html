<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameStore - Tienda Gamer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body class="bg-dark text-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary sticky-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3 text-warning" href="#"> GameStore</a>
      <button class="btn btn-warning position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#carritoDrawer">
         Carrito
        <span id="badge-contador" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
      </button>
    </div>
  </nav>

  <main class="container my-5">
    <h1 class="text-center mb-4 text-uppercase tracking-wide">Catálogo de Productos</h1>
    
    <div class="row mb-4 g-3">
      <div class="col-md-6">
        <input type="text" id="input-busqueda" class="form-control form-control-lg bg-secondary text-light border-0" placeholder="Buscar producto por nombre...">
      </div>
      <div class="col-md-6">
        <select id="select-categoria" class="form-select form-control-lg bg-secondary text-light border-0">
          <option value="todos">Todas las categorías</option>
          <option value="consolas">Consolas</option>
          <option value="juegos">Juegos</option>
          <option value="accesorios">Accesorios</option>
        </select>
      </div>
    </div>

    <div id="loading-spinner" class="text-center py-5">
      <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Cargando catálogo...</span>
      </div>
    </div>

    <div id="contenedor-productos" class="row g-4"></div>
  </main>

  <div class="offcanvas offcanvas-end bg-secondary text-light" tabindex="-1" id="carritoDrawer">
    <div class="offcanvas-header border-bottom border-dark">
      <h5 class="offcanvas-title fw-bold">🛒 Tu Carrito</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="contenedor-carrito" class="flex-grow-1"></div>
      
      <div class="border-top border-dark pt-3 mt-3">
        <div class="d-flex justify-content-between fs-4 fw-bold mb-3">
          <span>Total:</span>
          <span id="precio-total" class="text-warning">$0</span>
        </div>
        <div class="d-grid gap-2">
          <button id="btn-confirmar-compra" class="btn btn-warning btn-lg fw-bold">Finalizar Compra</button>
          <button id="btn-vaciar-carrito" class="btn btn-outline-danger">Vaciar Carrito</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  
  
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
